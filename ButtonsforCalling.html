<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emergency App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
        }

        .emergency-btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            font-size: 16px;
            color: white;
            display: block;
            text-align: center;
        }

        .police { background-color: #1976d2; }
        .ambulance { background-color: #d32f2f; }
        .fire { background-color: #f57c00; }

        .emergency-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚨 Emergency</h2>

    <!-- REAL PHONE CALLING -->
    <a href="tel:117" class="emergency-btn police">🚓 Call Police</a>
    <a href="tel:119" class="emergency-btn ambulance">🚑 Call Ambulance</a>
    <a href="tel:118" class="emergency-btn fire">🔥 Call Fire Service</a>
</div>

</body>
</html>
