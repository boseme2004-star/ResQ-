<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQ+ - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="app-page">

    <div class="page-header">
        <h2>Emergency Dashboard</h2>
        <p style="color: #ccc; font-size: 14px; margin-top: 5px;">
            <i class="fas fa-map-marker-alt"></i> Emana, Yaoundé
        </p>
    </div>

    <div class="dashboard-container">
        
        <div class="map-container">
            <iframe class="map-iframe" 
                src="https://www.openstreetmap.org/export/embed.html?bbox=11.5000,3.8500,11.5500,3.9000&layer=mapnik" 
                loading="lazy">
            </iframe>
        </div>

        <div class="sos-section">
            <div class="sos-circle" id="sosButton" onclick="triggerSOS()">
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <i class="fas fa-exclamation-triangle sos-icon"></i>
                    <span class="sos-label">SOS</span>
                </div>
            </div>
            <p style="color: #ff6b6b; font-weight: bold; font-size: 14px;"></p>
        </div>

        <div class="action-grid">
            <button class="emergency-btn" onclick="findHospitals()">
                <i class="fas fa-hospital" style="color: #3498db; font-size: 24px;"></i>
                <span>Nearby Hospitals</span>
            </button>
            
            <a href="tel:117" class="emergency-btn">
                <i class="fas fa-shield-alt" style="color: #f1c40f; font-size: 24px;"></i>
                <span>Call Police (117)</span>
            </a>
            
            <a href="tel:118" class="emergency-btn">
                <i class="fas fa-fire-extinguisher" style="color: #e74c3c; font-size: 24px;"></i>
                <span>Call firefighters(118)</span>
            </a>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-link active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="firstaid.html" class="nav-link">
            <i class="fas fa-kit-medical"></i>
            <span>First Aid</span>
        </a>
        <a href="profile.html" class="nav-link">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
