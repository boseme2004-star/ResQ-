<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQ+ - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA Meta Tags -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ResQ+">

<!-- Icons -->
<link rel="icon" href="icons/icon-192x192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192x192.png">

<!-- Manifest -->
<link rel="manifest" href="manifest.json">
</head>
<body class="auth-page">
    <button class="back-btn" onclick="window.location.href='index.html'">←</button>
    
    <div class="login-container">
        <div class="login-logo">🚑</div>
        <h1 style="margin-bottom: 30px; color: #2c3e50;">Sign In</h1>
        
        <div class="input-group">
            <label>Name</label>
            <input type="text" id="nameInput" placeholder="Enter name">
        </div>
        
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="passwordInput" placeholder="Enter password">
        </div>
        
        <button class="login-btn" onclick="login()">Login</button>
        
        <div style="margin-top: 20px;">
            <a href="#" style="color: #4a6fa5;">Forgot Password?</a>
        </div>
        
        <div class="continue-without-account">
            <p style="margin-top: 25px; color: #7f8c8d; font-size: 14px;">Don't have an account?</p>
            <button class="continue-btn" onclick="continueWithoutAccount()" style="background: transparent; color: #4a6fa5; border: 2px solid #4a6fa5; margin-top: 10px;">
                Continue Without Account
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
