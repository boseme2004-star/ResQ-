<!DOCTYPE html>
<html>
<head>
    <title>ResQ - Login & Sign Up</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .auth-container {
            background: white;
            width: 350px;
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            min-height: 580px;
        }
        
        .form-section {
            width: 100%;
            transition: all 0.4s ease;
        }
        
        .signup-section {
            position: absolute;
            top: 40px;
            left: 30px;
            right: 30px;
            transform: translateX(400px);
            opacity: 0;
        }
        
        .show-signup .login-section {
            transform: translateX(-400px);
            opacity: 0;
        }
        
        .show-signup .signup-section {
            transform: translateX(0);
            opacity: 1;
        }
        
        .title {
            color: #2c3e50;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 18px;
            margin-bottom: 40px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            color: #2c3e50;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }
        
        .input-group input:focus {
            border-color: #4a6fa5;
            outline: none;
        }
        
        .auth-btn {
            background: #4a6fa5;
            color: white;
            border: none;
            padding: 18px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.3s;
        }
        
        .auth-btn:hover {
            background: #3a5a80;
        }
        
        .auth-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        
        .toggle-link {
            margin-top: 30px;
            color: #7f8c8d;
        }
        
        .toggle-link a {
            color: #4a6fa5;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }
        
        .toggle-link a:hover {
            text-decoration: underline;
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #4a6fa5;
            z-index: 10;
        }
        
        .back-btn:hover {
            color: #3a5a80;
        }
        
        .password-toggle {
            text-align: right;
            margin-top: 5px;
        }
        
        .password-toggle a {
            color: #4a6fa5;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }
        
        .password-toggle a:hover {
            text-decoration: underline;
        }
        
        .logo-container {
            margin-bottom: 30px;
        }
        
        .logo-icon {
            background: #4a6fa5;
            width: 60px;
            height: 60px;
            border-radius: 15px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .input-group input.error {
            border-color: #e74c3c;
        }
        
        .success-message {
            background: #27ae60;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }
        
        .loading {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="goBack()">←</button>
    
    <div class="auth-container" id="authContainer">
        <!-- LOGIN SECTION -->
        <div class="form-section login-section">
            <div class="logo-container">
                <div class="logo-icon">🚑</div>
            </div>
            
            <h1 class="title">Hello</h1>
            <h2 class="subtitle">Welcome Back</h2>
            
            <div id="loginSuccess" class="success-message">Login successful! Redirecting...</div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label>Email or Username</label>
                    <input type="text" placeholder="Enter your email or username" id="loginInput" required>
                    <div class="error-message" id="loginInputError"></div>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" id="loginPassword" required>
                    <div class="error-message" id="loginPasswordError"></div>
                </div>
                
                <div class="password-toggle">
                    <a href="#" onclick="togglePassword('loginPassword', this)">👁 Show Password</a>
                </div>
                
                <button type="button" class="auth-btn" onclick="login()" id="loginBtn">Sign In</button>
            </form>
            
            <div class="toggle-link">
                Don't have an account? <a href="#" onclick="showSignup()">Sign Up</a>
            </div>
        </div>
        
        <!-- SIGNUP SECTION -->
        <div class="form-section signup-section">
            <div class="logo-container">
                <div class="logo-icon">🚑</div>
            </div>
            
            <h1 class="title">Create Account</h1>
            <h2 class="subtitle">Join ResQ Today</h2>
            
            <div id="signupSuccess" class="success-message">Account created successfully! Redirecting...</div>
            
            <form id="signupForm">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name" id="signupName" required>
                    <div class="error-message" id="signupNameError"></div>
                </div>
                
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" id="signupEmail" required>
                    <div class="error-message" id="signupEmailError"></div>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password (min. 6 characters)" id="signupPassword" required>
                    <div class="error-message" id="signupPasswordError"></div>
                </div>
                
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Confirm your password" id="confirmPassword" required>
                    <div class="error-message" id="confirmPasswordError"></div>
                </div>
                
                <div class="password-toggle">
                    <a href="#" onclick="toggleSignupPasswords()">👁 Show Password</a>
                </div>
                
                <button type="button" class="auth-btn" onclick="signup()" id="signupBtn">Create Account</button>
            </form>
            
            <div class="toggle-link">
                Already have an account? <a href="#" onclick="showLogin()">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        function goBack() {
            window.location.href = 'index.html';
        }
        
        function showSignup() {
            document.getElementById('authContainer').classList.add('show-signup');
            clearForm('signupForm');
            clearErrors();
            hideMessages();
        }
        
        function showLogin() {
            document.getElementById('authContainer').classList.remove('show-signup');
            clearForm('loginForm');
            clearErrors();
            hideMessages();
        }
        
        function clearForm(formId) {
            const form = document.getElementById(formId);
            if (form) {
                const inputs = form.querySelectorAll('input');
                inputs.forEach(input => input.value = '');
            }
        }
        
        function clearErrors() {
            const errors = document.querySelectorAll('.error-message');
            errors.forEach(error => {
                error.style.display = 'none';
                error.textContent = '';
            });
            
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => input.classList.remove('error'));
        }
        
        function hideMessages() {
            document.getElementById('loginSuccess').style.display = 'none';
            document.getElementById('signupSuccess').style.display = 'none';
        }
        
        function showError(fieldId, message) {
            const input = document.getElementById(fieldId);
            const errorElement = document.getElementById(fieldId + 'Error');
            
            if (input && errorElement) {
                input.classList.add('error');
                errorElement.textContent = message;
                errorElement.style.display = 'block';
            }
        }
        
        function togglePassword(passwordId, linkElement) {
            const passwordInput = document.getElementById(passwordId);
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                linkElement.textContent = '👁 Hide Password';
            } else {
                passwordInput.type = 'password';
                linkElement.textContent = '👁 Show Password';
            }
        }
        
        function toggleSignupPasswords() {
            const passwordInput = document.getElementById('signupPassword');
            const confirmInput = document.getElementById('confirmPassword');
            const link = document.querySelector('.signup-section .password-toggle a');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                confirmInput.type = 'text';
                link.textContent = '👁 Hide Password';
            } else {
                passwordInput.type = 'password';
                confirmInput.type = 'password';
                link.textContent = '👁 Show Password';
            }
        }
        
        function login() {
            const loginInput = document.getElementById('loginInput').value;
            const password = document.getElementById('loginPassword').value;
            const button = document.getElementById('loginBtn');
            const loginForm = document.getElementById('loginForm');
            
            clearErrors();
            hideMessages();
            
            // Validation
            if (!loginInput.trim()) {
                showError('loginInput', 'Please enter your email or username');
                return;
            }
            
            if (!password.trim()) {
                showError('loginPassword', 'Please enter your password');
                return;
            }
            
            // Show loading state
            button.innerHTML = 'Signing in...';
            button.disabled = true;
            loginForm.classList.add('loading');
            
            // Simulate API call delay
            setTimeout(() => {
                const users = JSON.parse(localStorage.getItem('resq_users') || '[]');
                const user = users.find(u => 
                    (u.email === loginInput || u.username === loginInput) && 
                    u.password === password
                );
                
                if (user) {
                    // Login success
                    localStorage.setItem('userName', user.name);
                    localStorage.setItem('resq_currentUser', JSON.stringify(user));
                    localStorage.setItem('isLoggedIn', 'true');
                    
                    // Show success message
                    document.getElementById('loginSuccess').style.display = 'block';
                    
                    // Redirect to home
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1500);
                } else {
                    // Login failed
                    showError('loginInput', 'Invalid credentials');
                    showError('loginPassword', 'Invalid credentials');
                    
                    // Reset button state
                    button.innerHTML = 'Sign In';
                    button.disabled = false;
                    loginForm.classList.remove('loading');
                }
            }, 1500);
        }
        
        function signup() {
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const button = document.getElementById('signupBtn');
            const signupForm = document.getElementById('signupForm');
            
            clearErrors();
            hideMessages();
            
            // Validation
            let hasError = false;
            
            if (!name.trim()) {
                showError('signupName', 'Please enter your full name');
                hasError = true;
            }
            
            if (!email.trim()) {
                showError('signupEmail', 'Please enter your email');
                hasError = true;
            } else if (!isValidEmail(email)) {
                showError('signupEmail', 'Please enter a valid email address');
                hasError = true;
            }
            
            if (!password.trim()) {
                showError('signupPassword', 'Please create a password');
                hasError = true;
            } else if (password.length < 6) {
                showError('signupPassword', 'Password must be at least 6 characters');
                hasError = true;
            }
            
            if (!confirmPassword.trim()) {
                showError('confirmPassword', 'Please confirm your password');
                hasError = true;
            } else if (password !== confirmPassword) {
                showError('confirmPassword', 'Passwords do not match');
                hasError = true;
            }
            
            if (hasError) return;
            
            // Check if email already exists
            const users = JSON.parse(localStorage.getItem('resq_users') || '[]');
            if (users.some(u => u.email === email)) {
                showError('signupEmail', 'Email already registered');
                return;
            }
            
            // Show loading state
            button.innerHTML = 'Creating account...';
            button.disabled = true;
            signupForm.classList.add('loading');
            
            // Simulate API call delay
            setTimeout(() => {
                // Create username from email (before @ symbol)
                const username = email.split('@')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
                
                const newUser = {
                    id: Date.now(),
                    name: name,
                    email: email,
                    username: username,
                    password: password,
                    createdAt: new Date().toISOString()
                };
                
                // Save to localStorage
                users.push(newUser);
                localStorage.setItem('resq_users', JSON.stringify(users));
                
                // Auto-login the user
                localStorage.setItem('userName', name);
                localStorage.setItem('resq_currentUser', JSON.stringify(newUser));
                localStorage.setItem('isLoggedIn', 'true');
                
                // Show success message
                document.getElementById('signupSuccess').style.display = 'block';
                
                // Redirect to home
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1500);
            }, 2000);
        }
        
        function isValidEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }
        
        // Handle Enter key for both forms
        document.addEventListener('keydown', function(event) {
            if(event.key === 'Enter') {
                event.preventDefault();
                if (document.getElementById('authContainer').classList.contains('show-signup')) {
                    signup();
                } else {
                    login();
                }
            }
        });
        
        // Initialize with test user if needed
        window.onload = function() {
            // Check if we need to create a test user
            if (!localStorage.getItem('resq_users')) {
                const testUsers = [
                    {
                        id: 1,
                        name: "Test User",
                        email: "test@example.com",
                        username: "testuser",
                        password: "password123",
                        createdAt: new Date().toISOString()
                    }
                ];
                localStorage.setItem('resq_users', JSON.stringify(testUsers));
                console.log("Test user created. Use: test@example.com / password123");
            }
            
            // Auto-focus on first input
            document.getElementById('loginInput').focus();
        };
    </script>
</body>
</html>
