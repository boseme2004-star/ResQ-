<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQ+ - Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="app-page">

    <div class="page-header">
        <h2>My Profile</h2>
    </div>

    <div class="profile-card">
        <div class="profile-avatar">
            <i class="fas fa-user"></i>
        </div>
        
        <div class="profile-row">
            <span class="label">Name:</span>
            <span class="value">Boseme Mbile</span>
        </div>
        <div class="profile-row">
            <span class="label">Blood Type:</span>
            <span class="value">O+</span>
        </div>
        <div class="profile-row">
            <span class="label">Allergies:</span>
            <span class="value">None</span>
        </div>
        <div class="profile-row">
            <span class="label">Conditions:</span>
            <span class="value">None</span>
        </div>
        <div class="profile-row">
            <span class="label">Emergency Contact:</span>
            <span class="value">Nurse (683-456-112)</span>
        </div>
    </div>

    <div style="padding: 20px; text-align: center;">
        <button class="login-btn" onclick="window.location.href='index.html'" style="background: #e74c3c;">
            Log Out
        </button>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-link">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="firstaid.html" class="nav-link">
            <i class="fas fa-kit-medical"></i>
            <span>First Aid</span>
        </a>
        <a href="profile.html" class="nav-link active">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
