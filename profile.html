<!DOCTYPE html>
<html>
<head>
    <title>ResQ+ - Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Header */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .user-name {
            font-size: 20px;
            font-weight: bold;
        }
        
        .profile-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        
        /* Main Content Container */
        .screen-container {
            display: flex;
            width: 300%; /* 3 screens: home, profile, guide */
            height: calc(100vh - 120px);
            transition: transform 0.3s ease;
        }
        
        .screen {
            width: 33.333%; /* Each screen takes 1/3 of container */
            height: 100%;
            padding: 20px;
            overflow-y: auto;
        }
        
        /* PROFILE SCREEN */
        .profile-screen {
            background: #1a1a2e;
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .profile-pic {
            width: 100px;
            height: 100px;
            background: #4a6fa5;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        .info-item {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
        }
        
        .action-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 15px;
            padding: 15px;
            color: white;
            font-size: 14px;
            text-align: center;
            width: 45%;
            cursor: pointer;
        }
        
        /* Navigation Dots */
        .nav-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            position: fixed;
            bottom: 70px;
            left: 0;
            right: 0;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            cursor: pointer;
        }
        
        .dot.active {
            background: #4fc3f7;
        }
        
        /* Footer */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            text-align: center;
        }
        
        .emergency-contacts-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
    <!-- For icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="user-name">Boseme Mbile</div>
        <button class="profile-btn" onclick="goToHome()">
            <i class="fas fa-home"></i>
        </button>
    </div>
    
    <!-- Swipeable Screens Container -->
    <div class="screen-container" id="screenContainer">
        <!-- SCREEN 1: PROFILE (Center Screen) -->
        <div class="screen profile-screen">
            <div class="profile-header">
                <div class="profile-pic">
                    <i class="fas fa-user"></i>
                </div>
                <h2>Your Profile</h2>
            </div>
            
            <div class="info-item">
                <strong>Name:</strong> Boseme Mbile
            </div>
            <div class="info-item">
                <strong>Blood Type:</strong> O+
            </div>
            <div class="info-item">
                <strong>Allergies:</strong> None
            </div>
            <div class="info-item">
                <strong>Emergency Contact:</strong> School Nurse (683456112)
            </div>
            <div class="info-item">
                <strong>Medical Conditions:</strong> None
            </div>
            
            <button class="action-btn" style="width: 100%; margin-top: 20px;" onclick="editProfile()">
                Edit Profile
            </button>
        </div>
        
        <!-- Empty screens for navigation -->
        <div class="screen" style="background: #1a1a2e;"></div>
        <div class="screen" style="background: #1a1a2e;"></div>
    </div>
    
    <!-- Navigation Dots -->
    <div class="nav-dots">
        <div class="dot" onclick="goToScreen(0)"></div>
        <div class="dot active" onclick="goToScreen(1)"></div>
        <div class="dot" onclick="goToScreen(2)"></div>
    </div>
    
    <!-- Footer -->
    <div class="footer">
        <button class="emergency-contacts-btn" onclick="manageContacts()">
            <i class="fas fa-address-book"></i> Emergency Contacts
        </button>
    </div>

    <script>
        // Current screen index (1 = profile is center)
        let currentScreen = 1;
        const screenContainer = document.getElementById('screenContainer');
        const dots = document.querySelectorAll('.dot');
        
        // SWIPE FUNCTIONALITY
        let startX = 0;
        let endX = 0;
        
        screenContainer.addEventListener('touchstart', function(e) {
            startX = e.touches[0].clientX;
        });
        
        screenContainer.addEventListener('touchmove', function(e) {
            endX = e.touches[0].clientX;
        });
        
        screenContainer.addEventListener('touchend', function() {
            const difference = startX - endX;
            
            if (Math.abs(difference) > 50) {
                if (difference > 0 && currentScreen < 2) {
                    goToScreen(currentScreen + 1);
                } else if (difference < 0 && currentScreen > 0) {
                    goToScreen(currentScreen - 1);
                }
            }
        });
        
        // For mouse drag on computers
        screenContainer.addEventListener('mousedown', function(e) {
            startX = e.clientX;
            document.addEventListener('mousemove', mouseMove);
            document.addEventListener('mouseup', mouseUp);
        });
        
        function mouseMove(e) {
            endX = e.clientX;
        }
        
        function mouseUp() {
            const difference = startX - endX;
            
            if (Math.abs(difference) > 50) {
                if (difference > 0 && currentScreen < 2) {
                    goToScreen(currentScreen + 1);
                } else if (difference < 0 && currentScreen > 0) {
                    goToScreen(currentScreen - 1);
                }
            }
            
            document.removeEventListener('mousemove', mouseMove);
            document.removeEventListener('mouseup', mouseUp);
        }
        
        // Function to go to specific screen
        function goToScreen(screenIndex) {
            currentScreen = screenIndex;
            screenContainer.style.transform = `translateX(-${screenIndex * 33.333}%)`;
            
            // Update dots
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === screenIndex);
            });
        }
        
        // Go to home screen
        function goToHome() {
            goToScreen(0);
            // In a real app, this would navigate to home.html
            window.location.href = 'home.html';
        }
        
        // Button functions
        function editProfile() {
            alert('Edit profile screen coming soon!');
        }
        
        function manageContacts() {
            alert('Emergency contacts screen coming soon!');
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' && currentScreen < 2) {
                goToScreen(currentScreen + 1);
            } else if (e.key === 'ArrowLeft' && currentScreen > 0) {
                goToScreen(currentScreen - 1);
            }
            else if (e.key === 'h' || e.key === 'H') {
                goToHome();
            }
        });
    </script>
</body>
</html>
